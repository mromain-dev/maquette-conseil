<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conseil">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Sauveterre Conseil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout : une colonne d'appli mobile (540px max) sous un bandeau de maquette ; une couleur pleine par rubrique ; navigation fixe en bas */
:root{
  /* Palette Google Agenda : mêmes teintes dans les deux thèmes */
  --k-basilic:#3B7D47; --k-menthe:#5AB57A; --k-eucalyptus:#3F9488; --k-paon:#4299E1; --k-cobalt:#4F86EE;
  --k-lavande:#7F87C9; --k-myrtille:#4651B2; --k-glycine:#B09FDA; --k-amethyste:#9C6CB0; --k-raisin:#8C2DA6;
  --k-cacao:#7A5547; --k-magenta:#A42356; --k-vieuxrose:#D23360; --k-flamant:#DB7F76; --k-tomate:#C9281F;
  --k-mandarine:#E6593A; --k-citrouille:#E3742A; --k-mangue:#E99A35; --k-banane:#F0C04B; --k-citron:#DFC45E; --k-avocat:#C1CA4F;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#E8EAEE; --ink:#1B1F24; --muted:#58606A; --line:#D8DBE0; --line-strong:#9AA1AA;
  --focus:#1A56DB;
  /* Vignettes : Bleu paon, Basilic, Citrouille et Myrtille, assombris juste assez pour le texte blanc */
  --agenda:#2F7BC0; --msg:#3B7D47; --docs:#C25A12; --admin:#4651B2;
  --agenda-soft:color-mix(in srgb, var(--agenda) 14%, var(--surface)); --agenda-text:color-mix(in srgb, var(--agenda) 62%, var(--ink));
  --msg-soft:color-mix(in srgb, var(--msg) 14%, var(--surface)); --msg-text:color-mix(in srgb, var(--msg) 62%, var(--ink));
  --docs-soft:color-mix(in srgb, var(--docs) 14%, var(--surface)); --docs-text:color-mix(in srgb, var(--docs) 62%, var(--ink));
  --admin-soft:color-mix(in srgb, var(--admin) 14%, var(--surface)); --admin-text:color-mix(in srgb, var(--admin) 62%, var(--ink));
  --on-tile:#FFFFFF; --alert:#C9281F; --on-alert:#FFFFFF;
  --shade:rgb(16 24 40 / .14); --shade-2:rgb(16 24 40 / .08); --rim:rgb(255 255 255 / .9);
  --glass:rgb(244 245 247 / .72); --glass-bar:rgb(255 255 255 / .74);
  --font-display:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1C1F23; --surface-2:#272B30; --ink:#ECEEF1; --muted:#A4ABB4; --line:#30353B; --line-strong:#5C636B;
    --focus:#8FB2FF;
    --shade:rgb(0 0 0 / .5); --shade-2:rgb(0 0 0 / .32); --rim:rgb(255 255 255 / .07);
    --glass:rgb(18 20 23 / .72); --glass-bar:rgb(28 31 35 / .74);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1C1F23; --surface-2:#272B30; --ink:#ECEEF1; --muted:#A4ABB4; --line:#30353B; --line-strong:#5C636B;
  --focus:#8FB2FF;
    --shade:rgb(0 0 0 / .5); --shade-2:rgb(0 0 0 / .32); --rim:rgb(255 255 255 / .07);
    --glass:rgb(18 20 23 / .72); --glass-bar:rgb(28 31 35 / .74);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px}
html.big{font-size:20px}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:1rem; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:540px; margin-inline:auto}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86rem; display:block}

.s-home{--sec:var(--ink); --sec-soft:var(--surface-2); --sec-text:var(--ink)}
.s-agenda{--sec:var(--agenda); --sec-soft:var(--agenda-soft); --sec-text:var(--agenda-text)}
.s-msg{--sec:var(--msg); --sec-soft:var(--msg-soft); --sec-text:var(--msg-text)}
.s-docs{--sec:var(--docs); --sec-soft:var(--docs-soft); --sec-text:var(--docs-text)}
.s-admin{--sec:var(--admin); --sec-soft:var(--admin-soft); --sec-text:var(--admin-text)}

/* Bandeau de maquette : hors de l'appli */
.mock{margin-block:12px 2px; padding:10px 12px 12px; border:1.5px dashed var(--line-strong); border-radius:14px; background:var(--surface-2)}
.mock-label{display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 10px; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.who{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:8px}
@media (min-width:520px){.who{grid-template-columns:repeat(4,minmax(0,1fr))}}
.who button{border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 10px; text-align:left; cursor:pointer; min-height:46px}
.who button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.who b{display:block; font-size:.88rem}
.who span{display:block; font-size:.74rem; opacity:.8}
.mock-note{font-size:.82rem; color:var(--muted); margin:8px 2px 0}

/* En-tête de l'appli */
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-block:18px 12px}
.place-line{font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.hello{font-family:var(--font-display); font-size:1.75rem; font-weight:700; line-height:1.15; margin-top:2px}
.meta-line{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:6px; color:var(--muted); font-size:.92rem}
.role{padding:3px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink); font-weight:700; font-size:.8rem}
.icon-btn{width:48px; height:48px; flex:none; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; font-family:var(--font-display); font-weight:700; font-size:1.05rem}
.icon-btn svg{width:22px; height:22px}

.view-head{display:flex; align-items:center; gap:12px; margin-block:6px 14px}
.glyph{width:46px; height:46px; flex:none; border-radius:13px; display:grid; place-items:center; background:var(--sec); color:var(--on-tile)}
.view-head h1{font-size:1.55rem}
.lead{color:var(--muted); margin:-4px 0 14px}
.eyebrow{font-family:var(--font-body); font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.grp{font-family:var(--font-display); font-size:1rem; font-weight:600; color:var(--muted); margin:20px 0 10px}
.sub-h{font-size:1.2rem; margin:4px 0 12px}
.list{display:grid; gap:10px}
.empty{padding:18px; border:1.5px dashed var(--line); border-radius:14px; color:var(--muted); text-align:center}

/* Accueil */
.bands{display:grid; gap:12px; margin-top:16px}
.band{display:flex; align-items:center; gap:14px; width:100%; min-height:94px; border:0; border-radius:var(--r); padding:16px 18px; background:var(--sec); color:var(--on-tile); text-align:left; cursor:pointer}
.band .ico{width:50px; height:50px; flex:none; border-radius:14px; background:rgb(255 255 255 / .18); display:grid; place-items:center}
.band .ico svg{width:28px; height:28px}
.band .txt{flex:1; min-width:0}
.band .lab{display:block; font-family:var(--font-display); font-weight:600; font-size:1.3rem; line-height:1.2}
.band .sub{display:block; font-size:.93rem; opacity:.93}
.band .num{font-family:var(--font-display); font-weight:700; font-size:2.4rem; line-height:1; font-variant-numeric:tabular-nums}
.mine{margin-top:20px}

/* Filtres */
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; min-height:42px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.chip .dot{width:11px; height:11px; border-radius:50%; background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.chip.sm{min-height:36px; padding:0 12px; font-size:.82rem}

/* Rendez-vous */
.ev{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:14px}
.day{width:66px; align-self:start; border-radius:14px; padding:8px 4px; text-align:center; background:color-mix(in srgb, var(--c) 18%, var(--surface)); color:color-mix(in srgb, var(--c) 50%, var(--ink))}
.day .wd{font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.day .dn{font-family:var(--font-display); font-size:1.95rem; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums}
.day .mo{font-size:.78rem; font-weight:700}
.ev h3{font-size:1.15rem; line-height:1.25}
.ev .what{margin:3px 0 10px}
.facts{display:grid; gap:4px; font-size:.9rem; color:var(--muted)}
.fact{display:flex; gap:7px; align-items:flex-start}
.fact svg{width:17px; height:17px; flex:none; margin-top:2px}
.rsvp{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.pill-btn{min-height:46px; padding:0 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.pill-btn svg{width:18px; height:18px}
.pill-btn.yes[aria-pressed="true"]{background:var(--msg); border-color:var(--msg); color:var(--on-tile)}
.pill-btn.no[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.link-btn{background:none; border:0; padding:0; min-height:44px; display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--sec-text, var(--ink)); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.link-btn svg{width:18px; height:18px}

/* Messages */
.chan{display:flex; align-items:center; gap:14px; width:100%; min-height:78px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:14px; cursor:pointer}
.sq{width:50px; height:50px; flex:none; border-radius:14px; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:1.05rem; background:color-mix(in srgb, var(--c) 18%, var(--surface)); color:color-mix(in srgb, var(--c) 50%, var(--ink))}
.chan .txt{flex:1; min-width:0}
.chan .nm{display:block; font-weight:700; font-size:1.05rem}
.chan .pv{display:block; font-size:.88rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.badge{min-width:26px; height:26px; padding:0 8px; border-radius:999px; background:var(--alert); color:var(--on-alert); font-weight:700; font-size:.84rem; display:inline-grid; place-items:center; font-variant-numeric:tabular-nums; flex:none}
body.calm .badge, body.calm .num{display:none}
.thread-head{display:flex; align-items:center; gap:12px; margin-block:6px 12px}
.thread-head h1{font-size:1.35rem}
.vis{display:flex; align-items:center; gap:6px; font-size:.84rem; color:var(--muted)}
.vis svg{width:16px; height:16px}
.pinned{display:flex; gap:10px; align-items:flex-start; background:var(--msg-soft); border-radius:14px; padding:12px 14px}
.pinned svg{width:20px; height:20px; flex:none; color:var(--msg-text); margin-top:2px}
.pinned b{display:block; font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--msg-text)}
.msgs{display:grid; gap:12px; margin-block:16px}
.msg{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:start}
.av{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); font-weight:700; font-size:.8rem}
.bubble{background:var(--surface); border:1.5px solid var(--line); border-radius:4px 16px 16px 16px; padding:10px 12px}
.msg.me .bubble{background:var(--msg-soft); border-color:var(--msg-soft)}
.who-line{display:flex; flex-wrap:wrap; gap:4px 8px; font-size:.82rem; color:var(--muted); margin-bottom:2px}
.who-line b{color:var(--ink)}
.composer{position:sticky; bottom:calc(84px + env(safe-area-inset-bottom, 0px)); display:flex; gap:8px; align-items:flex-end; background:var(--bg); padding-block:10px}
.composer textarea{flex:1; min-width:0; min-height:54px; max-height:160px; resize:none; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); padding:14px 12px}
.send{width:54px; height:54px; flex:none; border:0; border-radius:14px; background:var(--msg); color:var(--on-tile); display:grid; place-items:center; cursor:pointer}

/* Documents */
.search{display:flex; align-items:center; gap:8px; min-height:54px; padding:0 14px; margin-bottom:12px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; color:var(--muted)}
.search:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.search svg{width:20px; height:20px; flex:none}
.search input{flex:1; min-width:0; min-height:50px; border:0; background:transparent; color:var(--ink); outline:none}
.cats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.cats .cat:last-child:nth-child(odd){grid-column:1 / -1}
.cat{min-height:100px; border:0; border-radius:var(--r); padding:14px 16px; background:var(--docs-soft); color:var(--ink); text-align:left; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; gap:8px}
.cat .n{font-family:var(--font-display); font-weight:700; font-size:1.9rem; line-height:1; color:var(--docs-text); font-variant-numeric:tabular-nums}
.cat .l{font-weight:700}
.docs{display:grid; gap:8px}
.doc{display:flex; align-items:center; gap:12px; width:100%; min-height:70px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px; cursor:pointer}
.ft{width:44px; height:52px; flex:none; border-radius:8px; display:grid; place-items:center; background:var(--docs-soft); color:var(--docs-text); font-size:.7rem; font-weight:700; letter-spacing:.05em}
.doc .txt{flex:1; min-width:0}
.doc .t{display:block; font-weight:700; line-height:1.3}
.doc .m{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin-top:4px; font-size:.84rem; color:var(--muted)}
.new{padding:2px 8px; border-radius:6px; background:var(--docs-soft); color:var(--docs-text); font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase}

/* Administration */
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:16px; display:grid; gap:14px}
.card + .card{margin-top:14px}
.card h2{font-size:1.15rem}
.com-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; padding-bottom:12px; border-bottom:1px solid var(--line)}
.sw{width:30px; height:30px; flex:none; border-radius:9px; background:var(--c)}
.com-row .txt{flex:1; min-width:140px}
.com-row b{display:block}
.acts{display:flex; gap:6px; margin-left:auto}
.ghost{min-height:42px; padding:0 12px; border-radius:10px; border:1.5px solid var(--line); background:transparent; color:var(--ink); font-weight:700; cursor:pointer}
.danger{min-height:42px; padding:0 12px; border-radius:10px; border:0; background:var(--alert); color:var(--on-alert); font-weight:700; cursor:pointer}
.field label,.field .lbl{display:block; font-weight:700; margin-bottom:6px}
.field input{width:100%; min-height:52px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
.hues{display:flex; flex-wrap:wrap; gap:8px}
.hue{width:44px; height:44px; border-radius:12px; border:3px solid var(--surface); box-shadow:0 0 0 1.5px var(--line); background:var(--c); cursor:pointer}
.hue[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.primary{min-height:52px; padding:0 18px; border:0; border-radius:14px; background:var(--sec, var(--admin)); color:var(--on-tile); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.primary svg{width:20px; height:20px}
.err{color:var(--alert); font-weight:700; font-size:.92rem}
.member{display:grid; gap:8px; padding-top:12px; border-top:1px solid var(--line)}
.m-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.m-top .txt{flex:1; min-width:120px}
.m-top b{display:block}
.m-top select{margin-left:auto; min-height:44px; padding:0 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
.toggle-chips{display:flex; flex-wrap:wrap; gap:6px}
.tbl-wrap{overflow-x:auto}
table{width:100%; min-width:430px; border-collapse:collapse; font-size:.9rem}
th,td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
th{font-size:.74rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
td.y{color:var(--msg-text); font-weight:700}
td.n{color:var(--muted)}
.note{background:var(--admin-soft); border-radius:12px; padding:12px 14px; font-size:.92rem}

/* Navigation */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1.5px solid var(--line);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.tabs-in{max-width:540px; margin-inline:auto; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px}
.tab{position:relative; min-height:62px; border:0; border-radius:14px; background:transparent; color:var(--muted); display:grid; justify-items:center; align-content:center; gap:3px; font-weight:700; font-size:.76rem; cursor:pointer}
.tab svg{width:26px; height:26px}
.tab[aria-current="page"]{background:var(--sec-soft); color:var(--sec-text)}
.tab .badge{position:absolute; top:4px; left:calc(50% + 6px); min-width:20px; height:20px; padding:0 6px; font-size:.7rem}

/* Feuilles et messages flash */
.scrim{position:fixed; inset:0; z-index:30; background:rgb(0 0 0 / .45)}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:31; max-height:86vh; overflow:auto; background:var(--surface); border-radius:22px 22px 0 0;
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-in{max-width:540px; margin-inline:auto; display:grid; gap:14px}
.grab{width:46px; height:5px; border-radius:3px; background:var(--line); margin:0 auto}
.sheet h2{font-size:1.3rem}
.sheet-head{display:flex; gap:12px; align-items:center}
.dl{display:grid; gap:8px; margin:0}
.dl div{display:flex; justify-content:space-between; gap:12px; padding-bottom:8px; border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted)} .dl dd{margin:0; font-weight:700; text-align:right}
.row{display:flex; flex-wrap:wrap; gap:10px}
.sw-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-block:10px; border-bottom:1px solid var(--line)}
.switch{position:relative; width:60px; height:36px; flex:none; border:0; border-radius:999px; background:var(--line-strong); cursor:pointer}
.switch::after{content:""; position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:var(--surface); transition:left .15s}
.switch[aria-checked="true"]{background:var(--msg)}

function canSee(it, p){
  p = p || me();
  if (isAll(p)) return true;
  if (it.vis === 'tous') return true;
  if (it.vis === 'bureau') return p.role === 'adjoint';
  if (it.vis === 'com') return p.coms.includes(it.com);
  return false;
}
function relevant(it, p){ p = p || me(); return isAll(p) || !it.com || p.coms.includes(it.com); }
function passFilter(it){
  if (!canSee(it)) return false;
  if (S.filter === 'tout') return true;
  if (S.filter === 'moi') return relevant(it);
  return it.com === S.filter;

}
function visShort(it){
  if (it.vis === 'tous') return 'Tout le conseil';
  if (it.vis === 'bureau') return 'Bureau';
  const c = com(it.com); return c ? c.name : 'Archivé';
}

function upcoming(fn){
  return S.events.filter(e => d(e.date) >= TODAY && fn(e)).sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));

  return list.filter(ch => canSee(ch));
}
function unreadOf(ch){ return (S.read[S.me] || []).includes(ch.id) ? 0 : (S.unread[ch.id] || 0); }

function seesText(p){

  const cs = p.coms.map(com).filter(Boolean).map(c => '« ' + c.name + ' »');
  const list = cs.length ? (cs.length > 1 ? 'les commissions ' : 'la commission ') + joinFr(cs) : 'aucune commission';
  return p.role === 'adjoint'
    ? n + ' voit tout le conseil, le bureau et ' + list + '.'
    : n + ' voit tout le conseil et ' + list + '. Ni le bureau, ni l’administration.';
}

function head(title, icon){ return '<div class="view-head"><span class="glyph">' + icon + '</span><h1>' + title + '</h1></div>'; }

function chipsRow(){

  return '<div class="chips" role="group" aria-label="Filtrer">' + items.map(([v,l,h]) =>
    '<button type="button" class="chip"' + (h != null ? ' style="' + cv(h) + '"' : '') + ' aria-pressed="' + (S.filter === v) + '" data-act="filter" data-v="' + v + '">' +

function evCard(e){

function band(tab, sec, icon, label, sub, num){

function vHome(){
  const p = me();
  const evs = upcoming(e => canSee(e) && relevant(e));
  const next = evs[0];
  const in15 = evs.filter(e => days(TODAY, d(e.date)) <= 14).length;
  const unread = channels().reduce((a,c) => a + unreadOf(c), 0);
  const newDocs = S.docs.filter(x => canSee(x) && relevant(x) && isNew(x)).length;
  const coms = myComs(p).map(com);
  return (next ? '<section aria-labelledby="next-h"><h2 class="eyebrow" id="next-h">Ensuite</h2>' + evCard(next) + '</section>' : '') +
    '<div class="bands">' +
      band('agenda','agenda',ic.cal,'Agenda', in15 ? in15 + ' rendez-vous dans les 15 jours' : 'Rien de prévu', in15) +
      band('msgs','msg',ic.chat,'Messages', unread ? unread + ' message' + (unread > 1 ? 's' : '') + ' non lu' + (unread > 1 ? 's' : '') : 'Rien de nouveau', unread) +
      band('docs','docs',ic.doc,'Documents', newDocs ? newDocs + ' nouveau' + (newDocs > 1 ? 'x' : '') + ' cette semaine' : 'Rien de nouveau', newDocs) +
      (isAll(p) ? band('admin','admin',ic.admin,'Administration','Commissions, membres et droits', 0) : '') +
    '</div>' +
    (coms.length ? '<section class="mine"><h2 class="eyebrow">' + (isAll(p) ? 'Commissions' : 'Mes commissions') + '</h2><div class="chips">' +
      coms.map(c => '<button type="button" class="chip" style="' + cv(c.k) + '" data-act="gocom" data-v="' + c.id + '"><span class="dot"></span>' + esc(c.name) + '</button>').join('') +
      '</div></section>' : '');

function vAgenda(){
  const evs = upcoming(passFilter);
  const endThis = addDays(TODAY, (7 - TODAY.getDay()) % 7), endNext = addDays(endThis, 7);
  const groups = [
    ['Cette semaine', e => d(e.date) <= endThis],
    ['Semaine prochaine', e => d(e.date) > endThis && d(e.date) <= endNext],
    ['Plus tard', e => d(e.date) > endNext]
  ];
  const body = evs.length ? groups.map(([t,f]) => {
    const l = evs.filter(f);
    return l.length ? '<section><h2 class="grp">' + t + '</h2><div class="list">' + l.map(evCard).join('') + '</div></section>' : '';
  }).join('') : '<p class="empty">Aucun rendez-vous avec ce filtre.</p>';
  return head('Agenda', ic.cal) + chipsRow() + body;
}

function docResults(){
  const vis = S.docs.filter(x => canSee(x));
  if (S.q.trim()) {
    const q = norm(S.q.trim());
    const l = vis.filter(x => norm(x.title).includes(q));
    return '<h2 class="grp">' + l.length + ' résultat' + (l.length > 1 ? 's' : '') + '</h2>' + (l.length ? docList(l) : '<p class="empty">Aucun document ne correspond.</p>');
  }
  if (S.docCat) {
    const c = CATS.find(c => c.id === S.docCat);
    const l = vis.filter(x => x.cat === S.docCat && passFilter(x));
    return '<button type="button" class="link-btn" data-act="catback">' + ic.back + 'Toutes les catégories</button>' +

  const news = vis.filter(x => isNew(x) && passFilter(x));
  const cats = CATS.filter(c => vis.some(x => x.cat === c.id));
  return chipsRow() +
    (news.length ? '<h2 class="grp">Nouveaux cette semaine</h2>' + docList(news) : '') +
    '<h2 class="grp">Par catégorie</h2><div class="cats">' + cats.map(c => {

/* ---------- Feuilles ---------- */
let lastFocus = null, tt = null;
function openSheet(html){
  lastFocus = document.activeElement;
  const sh = $('#sheet');
  sh.innerHTML = '<div class="sheet-in"><div class="grab" aria-hidden="true"></div>' + html + '</div>';
  sh.hidden = false; $('#scrim').hidden = false;

}
function closeSheet(){
  $('#sheet').hidden = true; $('#scrim').hidden = true;

}
function toast(t){
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 3000);
}

/* ---------- Actions ---------- */
function go(tab){ S.tab = tab; S.chan = null; S.confirmDel = null; S.err = ''; if (tab !== 'docs') { S.docCat = null; } render(); window.scrollTo(0,0); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  switch (a) {
    case 'who':
      S.me = v; S.filter = 'moi'; S.chan = null; S.docCat = null; S.q = ''; S.confirmDel = null; S.err = '';
      render(); break;
    case 'tab': go(v); break;
    case 'gocom': S.filter = v; go('agenda'); break;
    case 'filter': S.filter = v; render(); break;
    case 'rsvp': {
      const k = S.me + ':' + id, ev = S.events.find(x => x.id === id);
      if (S.rsvp[k] === v) { delete S.rsvp[k]; }
      else { S.rsvp[k] = v; toast(v === 'oui' ? 'Présence notée.' : (ev && ev.conseil ? 'Absence notée. Vous pouvez donner votre pouvoir.' : 'Absence notée.')); }
      render(); break;
    }
    case 'pouvoir': pouvoirSheet(); break;
    case 'give': {
      const m = S.members.find(x => x.id === v); closeSheet();
      toast('Maquette : le pouvoir pour ' + m.name + ' partirait au secrétariat.'); break;
    }
    case 'chan':
      S.chan = v; S.read[S.me] = (S.read[S.me] || []).concat(v);
      render(); window.scrollTo(0,0); break;
    case 'back': S.chan = null; render(); break;
    case 'doc': docSheet(v); break;
    case 'cat': S.docCat = v; render(); break;
    case 'catback': S.docCat = null; render(); break;
    case 'open-doc': closeSheet(); toast('Maquette : le PDF s’ouvrirait ici.'); break;
    case 'settings': settingsSheet(); break;
    case 'switch':
      S[v] = !S[v]; b.setAttribute('aria-checked', String(S[v])); render(); break;
    case 'close': closeSheet(); break;
    case 'hue':
      S.newK = v;
      document.querySelectorAll('.hue').forEach(h => h.setAttribute('aria-pressed', String(h.dataset.v === S.newK)));
      { const hn = $('#hue-name'); if (hn) hn.textContent = palName(v); }
      break;
    case 'del': S.confirmDel = v; render(); break;
    case 'del-no': S.confirmDel = null; render(); break;
    case 'del-yes': {
      const c = com(v);
      S.commissions = S.commissions.filter(x => x.id !== v);
      S.members.forEach(m => { m.coms = m.coms.filter(x => x !== v); });
      if (S.filter === v) S.filter = 'moi';
      S.confirmDel = null; render();
      if (c) toast('Commission « ' + c.name + ' » supprimée.');
      break;
    }
    case 'mcom': {
      const m = S.members.find(x => x.id === id);
      m.coms = m.coms.includes(v) ? m.coms.filter(x => x !== v) : m.coms.concat(v);
      render(); break;
    }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'role') {
    const m = S.members.find(x => x.id === t.dataset.id);
    m.role = t.value; render(); toast('Rôle de ' + m.name + ' : ' + roleName(m) + '.');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'doc-q') { S.q = e.target.value; $('#doc-results').innerHTML = docResults(); }
  if (e.target.id === 'new-com') { S.newName = e.target.value; }
});

document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'send') {
    const ta = $('#composer'), t = ta.value.trim();
    if (!t) { ta.focus(); return; }
    (S.msgs[S.chan] = S.msgs[S.chan] || []).push({who:S.me, when:'À l’instant', text:t});
    render();
    const c = $('#composer'); if (c) { c.focus(); c.scrollIntoView({block:'end'}); }
  }
  if (f === 'addcom') {
    const name = S.newName.trim();
    if (!name) { S.err = 'Donnez un nom à la commission.'; render(); $('#new-com').focus(); return; }
    if (S.commissions.some(c => norm(c.name) === norm(name))) { S.err = 'Cette commission existe déjà.'; render(); $('#new-com').focus(); return; }
    const id = 'c' + Date.now();
    S.commissions.push({id, name, k:S.newK});
    S.pins[id] = 'Pas encore de message épinglé.'; S.msgs[id] = [];
    S.newName = ''; S.err = '';
    render();
    toast('« ' + name + ' » créée. Elle apparaît dans l’agenda, les messages et les documents.');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.target.id === 'composer' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.target.form.requestSubmit(); }
});

render();
})();
</script>
</body>
</html>
